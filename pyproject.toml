[project]
name = "color-by-numbers"
version = "0.1.0"
description = "Photo → playable color-by-numbers game (outlines, numbers, palette fill)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "scikit-learn",
    "danielutils",
    "Pillow",
]

[project.scripts]
color-by-numbers = "color_by_numbers.__main__:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["color_by_numbers"]

[tool.uv]
package = true
